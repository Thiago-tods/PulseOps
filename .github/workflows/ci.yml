name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Banco descartável só para os testes. As credenciais abaixo existem apenas neste job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pulseops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/pulseops_ci
      JWT_ACCESS_SECRET: ci-only-jwt-secret-with-at-least-32-characters-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Aplicar migrações no banco de teste
        run: npm run db:migrate:deploy
      - name: Testes com banco (e2e da API e integração do worker)
        run: npm run test:db
# Sem etapa de deploy: publicar exige autorização expressa (ver docs/DEPLOYMENT.md).
